<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Solar System Simulation</title>
  <style>
    body { margin: 0; background: black; overflow: hidden; }
    canvas { display: block; margin: auto; background-color: black; }
    #infoBox {
      position: absolute;
      color: white;
      background: rgba(0,0,0,0.7);
      padding: 10px;
      border-radius: 5px;
      display: none;
      pointer-events: none;
      font-family: sans-serif;
    }
  </style>
</head>
<body>
<canvas id="solarSystem"></canvas>
<div id="infoBox"></div>

<script>
  const canvas = document.getElementById("solarSystem");
  const ctx = canvas.getContext("2d");
  const infoBox = document.getElementById("infoBox");

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const centerX = canvas.width / 2;
  const centerY = canvas.height / 2;

  const planets = [
    { name: "Mercury", radius: 4, distance: 40, speed: 0.04, color: "gray", info: "Mercury: Closest planet to the Sun." },
    { name: "Venus", radius: 7, distance: 70, speed: 0.03, color: "orange", info: "Venus: Hottest planet with thick clouds." },
    { name: "Earth", radius: 8, distance: 100, speed: 0.02, color: "blue", info: "Earth: Our home planet." },
    { name: "Mars", radius: 6, distance: 140, speed: 0.018, color: "red", info: "Mars: The Red Planet." },
    { name: "Jupiter", radius: 14, distance: 180, speed: 0.01, color: "sienna", info: "Jupiter: Largest planet in the solar system." },
    { name: "Saturn", radius: 12, distance: 230, speed: 0.009, color: "goldenrod", info: "Saturn: Known for its rings." },
    { name: "Uranus", radius: 10, distance: 280, speed: 0.007, color: "lightblue", info: "Uranus: Rotates on its side." },
    { name: "Neptune", radius: 10, distance: 320, speed: 0.006, color: "blue", info: "Neptune: Farthest planet from the Sun." }
  ];

  const stars = Array.from({ length: 200 }, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    radius: Math.random() * 1.5,
    alpha: Math.random()
  }));

  let angle = 0;
  const positions = [];

  function drawStars() {
    stars.forEach(star => {
      ctx.beginPath();
      ctx.arc(star.x, star.y, star.radius, 0, 2 * Math.PI);
      ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
      ctx.fill();
    });
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    positions.length = 0;

    drawStars();

    // Draw the Sun
    ctx.beginPath();
    ctx.arc(centerX, centerY, 20, 0, 2 * Math.PI);
    ctx.fillStyle = "yellow";
    ctx.fill();
    ctx.font = "14px sans-serif";
    ctx.fillStyle = "white";
    ctx.fillText("Sun", centerX - 10, centerY - 25);

    // Draw planets
    planets.forEach((planet, index) => {
      const orbitAngle = angle * planet.speed;
      const x = centerX + planet.distance * Math.cos(orbitAngle);
      const y = centerY + planet.distance * Math.sin(orbitAngle);

      // Orbit path
      ctx.beginPath();
      ctx.arc(centerX, centerY, planet.distance, 0, 2 * Math.PI);
      ctx.strokeStyle = "rgba(255, 255, 255, 0.1)";
      ctx.stroke();

      // Planet
      ctx.beginPath();
      ctx.arc(x, y, planet.radius, 0, 2 * Math.PI);
      ctx.fillStyle = planet.color;
      ctx.fill();

      // Label
      ctx.fillStyle = "white";
      ctx.fillText(planet.name, x + planet.radius + 2, y);

      // Save position
      positions.push({ x, y, r: planet.radius, info: planet.info });
    });

    angle += 0.01;
    requestAnimationFrame(draw);
  }

  canvas.addEventListener("click", (e) => {
    const rect = canvas.getBoundingClientRect();
    const clickX = e.clientX - rect.left;
    const clickY = e.clientY - rect.top;

    for (let i = 0; i < positions.length; i++) {
      const dx = clickX - positions[i].x;
      const dy = clickY - positions[i].y;
      const distance = Math.sqrt(dx * dx + dy * dy);
      if (distance <= positions[i].r) {
        infoBox.style.left = `${e.pageX + 10}px`;
        infoBox.style.top = `${e.pageY + 10}px`;
        infoBox.innerHTML = positions[i].info;
        infoBox.style.display = "block";
        return;
      }
    }
    infoBox.style.display = "none";
  });

  draw();
</script>
</body>
</html>
